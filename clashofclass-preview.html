<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <title>Clash of Class — preview</title>
    <style>
      :root {
        color-scheme: dark;
        --lime: #b9ff4d;
        --gold: #f2c53d;
        --text: #e8e4d8;
        --dim: #8a8578;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
      }
      #stage { position: fixed; inset: 0; isolation: isolate; }
      #miniHud {
        position: fixed; z-index: 10; top: 0; left: 0; right: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(4, 6, 11, 0.9), transparent);
      }
      #miniHud .brand { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.22em; }
      #miniHud .brand em { color: var(--lime); font-style: normal; }
      #miniHud .score { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; color: var(--gold); }
      #miniHud .score span { color: var(--dim); font-size: 0.56rem; letter-spacing: 0.18em; display: block; text-align: right; }
      #toast {
        position: fixed; z-index: 11; left: 50%; bottom: 24px; transform: translate(-50%, 8px);
        max-width: 80%; padding: 8px 14px; border-radius: 99px;
        border: 1px solid rgba(242, 197, 61, 0.3); background: rgba(20, 16, 8, 0.94);
        color: #f0e6cf; font-size: 0.72rem; opacity: 0; transition: 0.2s; pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>
  <body>
    <div id="miniHud">
      <div class="brand">CLASH <em>OF CLASS</em> · standalone preview</div>
      <div class="score"><span>STARS</span><strong id="score">0</strong></div>
    </div>
    <div id="stage"></div>
    <div id="toast"></div>

    <script type="module">
      import game from '/games/clashofclass/index.js';
      import { createAudio } from '/src/lib/audio.js';

      const stage = document.getElementById('stage');
      const scoreEl = document.getElementById('score');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      const ctx = {
        stage,
        meta: { id: 'clashofclass', name: 'Clash of Class', scoreLabel: 'STARS' },
        width: stage.clientWidth,
        height: stage.clientHeight,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        assets: { url: () => null, has: () => false },
        audio: createAudio(),
        haptic: (pattern) => {
          if (navigator.vibrate) try { navigator.vibrate(pattern); } catch {}
        },
        best: 0,
        reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
        coarsePointer: window.matchMedia('(pointer: coarse)').matches,
        setScore: (value) => { scoreEl.textContent = String(Math.max(0, Math.round(value))); },
        saveScore: (value) => { scoreEl.textContent = String(Math.max(0, Math.round(value))); },
        setLabel: () => {},
        gameOver: (payload) => console.log('[gameOver]', payload),
        toast: (message) => {
          toastEl.textContent = message;
          toastEl.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
        },
      };

      const handle = await game.init(ctx);

      function fit() {
        ctx.width = stage.clientWidth;
        ctx.height = stage.clientHeight;
        ctx.dpr = Math.min(window.devicePixelRatio || 1, 2);
        handle.resize?.(ctx.width, ctx.height, ctx.dpr);
      }
      fit();
      window.addEventListener('resize', fit);

      let last = performance.now();
      function tick(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        try {
          handle.update?.(dt);
          handle.render?.();
        } catch (error) {
          console.error('[preview crash]', error);
          return;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
